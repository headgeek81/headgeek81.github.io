<!doctype html>
<html lang="en">
<head>
<!--PAGES-ONLY--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><!--/PAGES-ONLY-->
<title>HeadGeek Dashboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky bar, tab strip, one panel at a time. Data tables scroll inside their own box. */
:root{
  --bg:#f3f1f7; --surface:#fcfcfb; --surface-2:#f1eff5; --ink:#17131f; --ink-2:#4f4a5b; --ink-3:#6a6576;
  --line:#ded9e7; --accent:#6d2bd9; --accent-ink:#ffffff; --accent-soft:#ece4fb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --bad:#d03b3b;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121014; --surface:#1a1a19; --surface-2:#242227; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#9b97a6;
    --line:#38343f; --accent:#a678f5; --accent-ink:#15101f; --accent-soft:#2c2342;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121014; --surface:#1a1a19; --surface-2:#242227; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#9b97a6;
  --line:#38343f; --accent:#a678f5; --accent-ink:#15101f; --accent-soft:#2c2342;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:5rem}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin-inline:auto;padding-block:0 56px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.25rem}
h3{font-size:1rem}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.bar-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.5rem;line-height:1.1}
.brand small{color:var(--ink-3);font:12px var(--mono)}
.tools{display:flex;gap:8px;align-items:center}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font:12px var(--mono);background:var(--surface-2);border-radius:99px;padding:1px 7px;margin-left:6px;color:var(--ink-2)}
.tab .count.alert{background:var(--bad);color:#fff}

main{padding-top:22px;display:flex;flex-direction:column;gap:22px}
.banner{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.banner.sample{background:var(--accent-soft);border-color:var(--accent)}
.banner.bad{border-color:var(--bad)}
.banner.warn{border-color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stat .k{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font:600 2rem/1.15 var(--display);font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--ink-2)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}

.pill{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:2px 10px 2px 8px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.pill i{font-style:normal;font-weight:700}
.pill.posted i{color:var(--good)} .pill.failed i{color:var(--bad)} .pill.scheduled i{color:var(--accent)} .pill.waiting i{color:var(--ink-3)}
.pill.failed{border-color:var(--bad)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}

.tools-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:660px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
.title{font-weight:600}
.sub{font-size:12px;color:var(--ink-3)}
.cellv{font:12px var(--mono);color:var(--ink-2);margin-top:4px}
.detail td{background:var(--surface-2)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.detail h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.box{white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 6px;font-family:var(--body)}
.err{color:var(--ink);border-left:3px solid var(--bad);padding-left:8px;font-size:13px;word-break:break-word}

.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
.item .l{min-width:0;flex:1 1 260px}
.item .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.events{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.events li{display:flex;gap:8px;align-items:baseline}
.done{opacity:.55}

.tipbox{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:3;min-width:150px}
.chartwrap{position:relative}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:8px}
svg text{font-family:var(--mono);font-size:11px;fill:var(--ink-3)}
.gridline{stroke:var(--line);stroke-width:1}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center}
.barrow .name{grid-column:1 / -1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:12px;background:var(--surface-2);border-radius:0 4px 4px 0}
.fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.barrow .val{font:12px var(--mono);text-align:right;color:var(--ink-2)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.empty b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--ink);margin-bottom:4px}
footer{color:var(--ink-3);font-size:12px;margin-top:8px}
@media (prefers-reduced-motion: no-preference){.fill{transition:width .4s ease}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="bar-top">
      <div class="brand"><h1>HeadGeek Dashboard</h1><small id="updated">loading...</small></div>
      <div class="tools">
        <a class="btn primary" href="https://twitch.tv/headgeek81" target="_blank" rel="noopener">twitch.tv/headgeek81</a>
        <button class="btn" id="theme" type="button">Light / dark</button>
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <main id="main"></main>
  <footer>Numbers are read from YouTube, Facebook and Instagram each time ClipBot runs, so they are as fresh as the last run. Instagram views stay blank unless Instagram insights are enabled.</footer>
</div>
<noscript>This dashboard needs JavaScript.</noscript>

<script>
(function(){
"use strict";
var ET="America/New_York";
var PLAT=[{k:"youtube",n:"YouTube",c:"var(--s1)"},{k:"facebook",n:"Facebook",c:"var(--s2)"},{k:"instagram",n:"Instagram",c:"var(--s3)"}];
var STATUS={posted:["✓","Posted"],scheduled:["◷","Scheduled"],waiting:["…","Waiting"],failed:["!","Failed"]};
var TABS=[["overview","Overview"],["clips","Clips"],["schedule","Schedule"],["runs","Runs"],["tiktok","TikTok"],["golive","Go live"]];
var D=null, G=null, state={tab:"overview",filter:"all",sort:"new",q:"",open:{}};

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(iso,o){try{return new Date(iso).toLocaleString("en-US",Object.assign({timeZone:ET},o))}catch(e){return ""}}
function dt(iso){return iso?fmt(iso,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+" ET":"-"}
function dday(iso){return iso?fmt(iso,{month:"short",day:"numeric"}):"-"}
function num(v){return typeof v==="number"&&isFinite(v)?v:(v!=null&&v!==""&&!isNaN(+v)?+v:null)}
function nf(v){v=num(v);return v==null?"n/a":v>=10000?(v/1000).toFixed(v>=100000?0:1)+"k":v.toLocaleString("en-US")}
function ago(iso){var m=Math.round((Date.now()-new Date(iso))/60000);if(m<1)return"just now";if(m<60)return m+" min ago";var h=Math.round(m/60);if(h<48)return h+" hr ago";return Math.round(h/24)+" days ago"}
function pill(st){var s=STATUS[st]||STATUS.waiting;return '<span class="pill '+esc(st)+'"><i aria-hidden="true">'+s[0]+'</i>'+s[1]+'</span>'}
function clipViews(c){var t=0,any=false;PLAT.forEach(function(p){var v=num(((c.platforms||{})[p.k]||{}).views);if(v!=null){t+=v;any=true}});return any?t:null}
function copy(text,btn){
  function ok(){var o=btn.textContent;btn.textContent="Copied";setTimeout(function(){btn.textContent=o},1200)}
  function fb(){var t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){btn.textContent="Select and copy"}document.body.removeChild(t)}
  try{navigator.clipboard.writeText(text).then(ok,fb)}catch(e){fb()}
}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ---------- derived numbers ---------- */
function derive(){
  var clips=(D.clips||[]).slice();
  var live=0,sched=0,bad=0,views=0,per={youtube:null,facebook:null,instagram:null};
  clips.forEach(function(c){
    var any=false;
    PLAT.forEach(function(p){var x=(c.platforms||{})[p.k]||{};
      if(x.status==="posted"){any=true}
      if(x.status==="scheduled"){sched++}
      if(x.status==="failed"){bad++}
      var v=num(x.views);if(v!=null){per[p.k]=(per[p.k]||0)+v;views+=v}
    });
    if(any)live++;
  });
  var now=Date.now();
  var upcoming=clips.filter(function(c){return c.slot&&new Date(c.slot)>now}).sort(function(a,b){return new Date(a.slot)-new Date(b.slot)});
  return {clips:clips,live:live,sched:sched,bad:bad,views:views,per:per,upcoming:upcoming};
}

/* ---------- charts ---------- */
function niceMax(v){if(v<=0)return 10;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function lineChart(host,hist,asTable){
  var pts=(hist||[]).filter(function(h){return h&&h.date});
  if(!pts.length){host.innerHTML='<div class="empty"><b>No history yet</b>The chart fills in after ClipBot has run a few times.</div>';return}
  if(asTable){
    host.innerHTML='<div class="tablebox"><table style="min-width:420px"><thead><tr><th>Date</th>'+PLAT.map(function(p){return'<th class="num">'+p.n+'</th>'}).join("")+'</tr></thead><tbody>'+
      pts.slice().reverse().map(function(h){return'<tr><td>'+esc(h.date)+'</td>'+PLAT.map(function(p){return'<td class="num">'+nf(h[p.k])+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>';return}
  var W=Math.max(300,host.clientWidth||640),H=250,m={l:46,r:(W<520?58:124),t:10,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b;
  var max=0;pts.forEach(function(h){PLAT.forEach(function(p){var v=num(h[p.k]);if(v!=null&&v>max)max=v})});
  var ym=niceMax(max),n=pts.length;
  var X=function(i){return m.l+(n===1?iw/2:iw*i/(n-1))},Y=function(v){return m.t+ih-ih*v/ym};
  var s='<svg role="img" aria-label="Total views by platform over time" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  for(var t=0;t<=4;t++){var v=ym*t/4,y=Y(v);s+='<line class="gridline" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(m.l-8)+'" y="'+(y+4)+'" text-anchor="end">'+nf(v)+'</text>'}
  var step=Math.max(1,Math.ceil(n/6));
  pts.forEach(function(h,i){if(i%step===0||i===n-1){s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(h.date.slice(5))+'</text>'}});
  var ends=[];
  PLAT.forEach(function(p){
    var d="",pen=false,last=null;
    pts.forEach(function(h,i){var v=num(h[p.k]);if(v==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" ";pen=true;last=[i,v]});
    if(d)s+='<path d="'+d+'" fill="none" stroke="'+p.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(function(h,i){var v=num(h[p.k]);if(v!=null&&(n<=14||i===n-1))s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4" fill="'+p.c+'" stroke="var(--surface)" stroke-width="2"/>'});
    if(last)ends.push({p:p,y:Y(last[1]),v:last[1]});
  });
  ends.sort(function(a,b){return a.y-b.y});
  for(var i=1;i<ends.length;i++){if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14}
  ends.forEach(function(e){s+='<text x="'+(W-m.r+10)+'" y="'+(e.y+4)+'" style="fill:var(--ink-2)">'+(W<520?'':e.p.n+' ')+nf(e.v)+'</text>'});
  s+='<line id="xh" x1="0" x2="0" y1="'+m.t+'" y2="'+(m.t+ih)+'" stroke="var(--ink-3)" stroke-dasharray="3 3" visibility="hidden"/><rect id="ov" x="'+m.l+'" y="'+m.t+'" width="'+iw+'" height="'+ih+'" fill="transparent"/></svg><div class="tipbox" id="tip" hidden></div>';
  host.innerHTML=s;
  var svg=$("svg",host),tip=$("#tip",host),xh=$("#xh",host);
  function move(ev){
    var r=svg.getBoundingClientRect(),px=ev.clientX-r.left,i=n===1?0:Math.round((px-m.l)/iw*(n-1));
    i=Math.max(0,Math.min(n-1,i));var h=pts[i];
    xh.setAttribute("x1",X(i));xh.setAttribute("x2",X(i));xh.setAttribute("visibility","visible");
    tip.hidden=false;
    tip.innerHTML='<b>'+esc(h.date)+'</b>'+PLAT.map(function(p){return'<div><span class="sw" style="background:'+p.c+'"></span>'+p.n+': '+nf(h[p.k])+'</div>'}).join("");
    var tx=X(i)+14;if(tx+170>W)tx=X(i)-174;tip.style.left=tx+"px";tip.style.top="8px";
  }
  function leave(){tip.hidden=true;xh.setAttribute("visibility","hidden")}
  var ov=$("#ov",host);ov.addEventListener("pointermove",move);ov.addEventListener("pointerdown",move);ov.addEventListener("pointerleave",leave);
}
function topBars(host,clips){
  var rows=clips.map(function(c){return{c:c,v:clipViews(c)}}).filter(function(x){return x.v!=null}).sort(function(a,b){return b.v-a.v}).slice(0,8);
  if(!rows.length){host.innerHTML='<div class="empty"><b>No view counts yet</b>They appear after the first run that can read them.</div>';return}
  var max=rows[0].v||1;
  host.innerHTML='<div class="bars">'+rows.map(function(r){
    return'<div class="barrow" title="'+esc(r.c.title)+': '+r.v+' views"><div class="name">'+esc(r.c.title)+'</div><div class="track"><div class="fill" style="width:'+Math.max(1,r.v/max*100)+'%"></div></div><div class="val">'+nf(r.v)+'</div></div>'}).join("")+'</div>';
}

/* ---------- tabs ---------- */
function banner(){
  var b="";
  if(D.sample)b+='<div class="banner sample"><b>Sample data.</b><span>This is an example of what you will see. Your real posts appear after the next ClipBot run.</span></div>';
  else if(D.generated_at&&(Date.now()-new Date(D.generated_at))>30*3600*1000)b+='<div class="banner warn"><b>Data is '+esc(ago(D.generated_at).replace(" ago",""))+' old.</b><span>ClipBot normally runs once a day. Check the Actions tab on GitHub if this keeps growing.</span></div>';
  return b;
}
function viewOverview(){
  var d=derive(),next=d.upcoming[0],last=(D.runs||[]).filter(function(r){return !r.dry_run}).slice(-1)[0];
  var attention=d.clips.filter(function(c){return PLAT.some(function(p){return((c.platforms||{})[p.k]||{}).status==="failed"})});
  var h=banner();
  h+='<section class="stats" aria-label="Summary">'+
    '<div class="stat"><div class="k">Clips posted</div><div class="v">'+d.live+'</div><div class="s">live on at least one platform</div></div>'+
    '<div class="stat"><div class="k">Scheduled</div><div class="v">'+d.upcoming.length+'</div><div class="s">'+(next?'next: '+dday(next.slot)+', '+esc(next.title):'nothing queued yet')+'</div></div>'+
    '<div class="stat"><div class="k">Total views</div><div class="v">'+nf(d.views)+'</div><div class="s">YouTube '+nf(d.per.youtube)+' / Facebook '+nf(d.per.facebook)+' / Instagram '+nf(d.per.instagram)+'</div></div>'+
    '<div class="stat"><div class="k">Last run</div><div class="v" style="font-size:1.35rem">'+(last?esc(ago(last.at)):"no runs yet")+'</div><div class="s">'+(last?esc(dt(last.at)):"")+'</div></div>'+
  '</section>';
  if(attention.length){
    h+='<section class="card"><header><h2>Needs attention</h2><span class="muted">'+attention.length+' clip'+(attention.length>1?'s':'')+' with a failed post</span></header><div class="list">'+attention.map(function(c){
      return'<div class="item"><div class="l"><div class="title">'+esc(c.title)+'</div>'+PLAT.map(function(p){var x=(c.platforms||{})[p.k]||{};return x.status==="failed"?'<div class="err" style="margin-top:6px"><b>'+p.n+':</b> '+esc(x.error||"Failed, will retry on the next run.")+'</div>':""}).join("")+'</div></div>'}).join("")+'</div></section>';
  }
  h+='<div class="cols"><section class="card"><header><h2>Views by platform</h2><button class="btn" id="tbl" type="button">'+(state.asTable?"Show chart":"Show table")+'</button></header>'+
     '<div class="legend">'+PLAT.map(function(p){return'<span><span class="sw" style="background:'+p.c+'"></span>'+p.n+'</span>'}).join("")+'</div><div class="chartwrap" id="line"></div></section>'+
     '<section class="card"><header><h2>Top clips</h2><span class="muted">by total views</span></header><div id="bars"></div></section></div>';
  return h;
}
function after_overview(){
  var d=derive();lineChart($("#line"),D.history,state.asTable);topBars($("#bars"),d.clips);
  var t=$("#tbl");if(t)t.onclick=function(){state.asTable=!state.asTable;render()};
}
function platCell(c,p){
  var x=(c.platforms||{})[p.k]||{status:"waiting"};
  var l=x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">open</a>':"";
  var stats=(x.status==="posted"||x.status==="scheduled")&&(num(x.views)!=null||num(x.likes)!=null)?'<div class="cellv">'+nf(x.views)+' views / '+nf(x.likes)+' likes / '+nf(x.comments)+' comments</div>':"";
  var when=x.status==="scheduled"&&c.slot?'<div class="cellv">'+esc(dday(c.slot))+'</div>':"";
  return pill(x.status)+(x.privacy&&x.status==="posted"&&x.privacy!=="public"?' <span class="sub">'+esc(x.privacy)+'</span>':"")+stats+when+(l?'<div class="sub">'+l+'</div>':"");
}
function viewClips(){
  var d=derive(),rows=d.clips.filter(function(c){
    var st=PLAT.map(function(p){return((c.platforms||{})[p.k]||{}).status});
    if(state.filter==="posted"&&st.indexOf("posted")<0)return false;
    if(state.filter==="scheduled"&&st.indexOf("scheduled")<0)return false;
    if(state.filter==="failed"&&st.indexOf("failed")<0)return false;
    if(state.q&&((c.title||"")+" "+(c.game||"")).toLowerCase().indexOf(state.q.toLowerCase())<0)return false;
    return true;
  });
  rows.sort(function(a,b){
    if(state.sort==="views")return (clipViews(b)||0)-(clipViews(a)||0);
    return new Date(b.slot||b.at||0)-new Date(a.slot||a.at||0);
  });
  var h=banner()+'<div><div class="tools-row"><input type="search" id="q" placeholder="Search clips or games" value="'+esc(state.q)+'" aria-label="Search clips">'+
    '<div class="chips" role="group" aria-label="Filter">'+["all","posted","scheduled","failed"].map(function(f){return'<button type="button" class="chip" data-f="'+f+'" aria-pressed="'+(state.filter===f)+'">'+f[0].toUpperCase()+f.slice(1)+'</button>'}).join("")+'</div>'+
    '<select id="sort" aria-label="Sort"><option value="new"'+(state.sort==="new"?" selected":"")+'>Newest first</option><option value="views"'+(state.sort==="views"?" selected":"")+'>Most views</option></select></div>';
  if(!rows.length)return h+'<div class="empty"><b>No clips match</b>'+(d.clips.length?"Try a different filter or search.":"Clips show up here after ClipBot posts or schedules them.")+'</div></div>';
  h+='<div class="tablebox"><table><thead><tr><th>Date</th><th>Clip</th>'+PLAT.map(function(p){return'<th><span class="sw" style="background:'+p.c+'"></span>'+p.n+'</th>'}).join("")+'<th class="num">Views</th></tr></thead><tbody>';
  rows.forEach(function(c){
    var open=state.open[c.id];
    h+='<tr class="row" data-id="'+esc(c.id)+'" tabindex="0" aria-expanded="'+!!open+'"><td class="mono">'+esc(dday(c.slot||c.at))+'</td><td><div class="title">'+esc(c.title)+'</div><div class="sub">'+esc(c.game||"")+'</div></td>'+
      PLAT.map(function(p){return'<td>'+platCell(c,p)+'</td>'}).join("")+'<td class="num mono">'+nf(clipViews(c))+'</td></tr>';
    if(open){
      var cap=c.captions||{};
      h+='<tr class="detail"><td colspan="6"><div class="detail-grid">'+
        [["YouTube title",cap.yt_title],["Facebook caption",cap.fb],["Instagram caption",cap.ig],["TikTok caption",cap.tt]].filter(function(x){return x[1]}).map(function(x,i){
          return'<div><h4>'+x[0]+'</h4><pre class="box">'+esc(x[1])+'</pre><button type="button" class="btn" data-copy="'+esc(x[1])+'">Copy</button></div>'}).join("")+
        '</div>'+PLAT.map(function(p){var x=(c.platforms||{})[p.k]||{};return x.error?'<div class="err" style="margin-top:10px"><b>'+p.n+':</b> '+esc(x.error)+'</div>':""}).join("")+'</td></tr>';
    }
  });
  return h+'</tbody></table></div><p class="sub">Click a clip to see its captions and any errors.</p></div>';
}
function viewSchedule(){
  var d=derive(),q=D.queue||{},s=D.settings||{};
  var h=banner()+'<section class="card"><header><h2>Coming up</h2><span class="muted">'+(s.schedule_days?s.schedule_days+' days ahead, '+(s.post_hour_et||12)+':00 ET':'')+'</span></header>';
  if(!d.upcoming.length)h+='<div class="empty"><b>Nothing scheduled</b>ClipBot fills the next days on its next run, as long as it has clips to post.</div>';
  else h+='<div class="list">'+d.upcoming.map(function(c){return'<div class="item"><div class="l"><div class="title">'+esc(c.title)+'</div><div class="sub">'+esc(c.game||"")+'</div></div><div class="r"><span class="mono">'+esc(dt(c.slot))+'</span>'+
    PLAT.map(function(p){var x=(c.platforms||{})[p.k]||{};return'<span class="pill '+(x.status==="scheduled"?"scheduled":x.status||"waiting")+'"><span class="sw" style="background:'+p.c+';margin:0"></span>'+(p.k==="instagram"&&x.status!=="posted"?"posts on the day":(STATUS[x.status]||STATUS.waiting)[1])+'</span>'}).join("")+'</div></div>'}).join("")+'</div>';
  h+='</section><section class="card"><header><h2>Waiting in the queue</h2><span class="muted">'+(q.waiting!=null?q.waiting+' clips not yet used':'')+'</span></header>';
  h+=(q.next&&q.next.length)?'<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">'+q.next.map(function(t){return'<li>'+esc(t)+'</li>'}).join("")+'</ol><p class="sub">Next in line, picked by newest first, then most views.</p>':'<div class="empty"><b>Queue unknown</b>This fills in after the next run.</div>';
  return h+'</section>';
}
function viewRuns(){
  var runs=(D.runs||[]).slice().reverse();
  var h=banner();
  if(!runs.length)return h+'<div class="empty"><b>No runs recorded yet</b>Each ClipBot run adds a line here with what it posted, scheduled and any errors.</div>';
  return h+'<div class="list">'+runs.map(function(r){
    var ev=r.events||[],bad=ev.filter(function(e){return e.kind==="failed"}).length,posted=ev.filter(function(e){return e.kind==="posted"||e.kind==="due"}).length,sch=ev.filter(function(e){return e.kind==="scheduled"}).length;
    var summ=r.dry_run?"Preview only, nothing posted":(posted+sch+bad===0?"Nothing to post":[posted?posted+" posted":"",sch?sch+" scheduled":"",bad?bad+" failed":""].filter(Boolean).join(", "));
    return'<div class="item"><div class="l"><div class="title">'+esc(dt(r.at))+'</div><div class="sub">'+esc(ago(r.at))+'</div><div style="margin-top:6px">'+esc(summ)+'</div>'+
      (ev.length?'<ul class="events">'+ev.map(function(e){return'<li>'+pill(e.kind==="failed"?"failed":e.kind==="scheduled"?"scheduled":"posted")+'<span>'+esc((e.platform||"")+" "+(e.title||"")+(e.detail?" - "+e.detail:""))+'</span></li>'}).join("")+'</ul>':"")+'</div>'+
      '<div class="r">'+(r.url?'<a class="btn" href="'+esc(r.url)+'" target="_blank" rel="noopener">View log</a>':"")+'</div></div>'}).join("")+'</div>';
}
function viewTikTok(){
  var done=store("hg-tt-done")||[],cl=derive().clips.filter(function(c){return c.tiktok&&(c.tiktok.video_url||c.captions&&c.captions.tt)});
  cl.sort(function(a,b){return new Date(a.slot||a.at||0)-new Date(b.slot||b.at||0)});
  var todo=cl.filter(function(c){return done.indexOf(c.id)<0}).length;
  var h=banner()+'<div class="banner"><span><b>'+todo+' video'+(todo===1?"":"s")+' waiting to post.</b> Download, upload in TikTok Studio, paste the caption, then add the pinned comment after it goes live. "Mark posted" is saved in this browser only.</span></div>';
  if(!cl.length)return h+'<div class="empty"><b>No TikTok packages yet</b>Each run adds one here with the video, caption and pinned comment.</div>';
  return h+'<div class="list">'+cl.map(function(c){
    var t=c.tiktok||{},cap=(c.captions||{}),isDone=done.indexOf(c.id)>=0;
    return'<div class="item'+(isDone?" done":"")+'"><div class="l"><div class="title">'+esc(c.title)+'</div><div class="sub">'+esc(c.game||"")+(c.slot?' / '+esc(dday(c.slot)):"")+'</div>'+
      (cap.tt?'<pre class="box" style="margin-top:8px">'+esc(cap.tt)+'</pre>':"")+(cap.tt_comment?'<div class="sub">Pinned comment</div><pre class="box">'+esc(cap.tt_comment)+'</pre>':"")+'</div>'+
      '<div class="r" style="align-self:flex-start">'+(t.video_url?'<a class="btn primary" href="'+esc(t.video_url)+'" target="_blank" rel="noopener">Download video</a>':'<span class="pill waiting"><i>…</i>Video expired</span>')+
      (cap.tt?'<button type="button" class="btn" data-copy="'+esc(cap.tt)+'">Copy caption</button>':"")+(cap.tt_comment?'<button type="button" class="btn" data-copy="'+esc(cap.tt_comment)+'">Copy comment</button>':"")+
      '<button type="button" class="btn" data-done="'+esc(c.id)+'">'+(isDone?"Undo":"Mark posted")+'</button></div></div>'}).join("")+'</div>';
}
function viewGoLive(){
  var h=banner();
  var ch=((G&&G.checks)||[]).slice().reverse();
  if(!ch.length)return h+'<div class="empty"><b>No checks recorded yet</b>GoLive checks Twitch on Friday, Sunday and Monday evenings. Each check appears here.</div>';
  return h+'<div class="list">'+ch.map(function(c){return'<div class="item"><div class="l"><div class="title">'+esc(dt(c.at))+'</div><div class="sub">'+(c.live?'Live: '+esc(c.title||"")+(c.game?' ('+esc(c.game)+')':""):'Offline, nothing posted')+'</div></div>'+
    (c.live?'<div class="r"><span class="pill '+(c.facebook==="posted"?"posted":c.facebook==="failed"?"failed":"waiting")+'"><i>'+(c.facebook==="posted"?"✓":c.facebook==="failed"?"!":"…")+'</i>Facebook '+esc(c.facebook||"")+'</span><span class="pill '+(c.instagram==="posted"?"posted":c.instagram==="failed"?"failed":"waiting")+'"><i>'+(c.instagram==="posted"?"✓":c.instagram==="failed"?"!":"…")+'</i>Instagram '+esc(c.instagram||"")+'</span></div>':"")+'</div>'}).join("")+'</div>';
}

/* ---------- shell ---------- */
function tabsHtml(){
  var d=D?derive():null;
  $("#tabs").innerHTML=TABS.map(function(t){
    var extra="";
    if(d&&t[0]==="clips"&&d.bad)extra='<span class="count alert">'+d.bad+'</span>';
    if(d&&t[0]==="schedule")extra='<span class="count">'+d.upcoming.length+'</span>';
    return'<button class="tab" role="tab" type="button" data-tab="'+t[0]+'" aria-selected="'+(state.tab===t[0])+'">'+t[1]+extra+'</button>'}).join("");
}
function render(){
  tabsHtml();
  var main=$("#main");
  if(!D){main.innerHTML='<div class="empty"><b>No data yet</b>ClipBot has not published a data.json file. After its next run with the dashboard turned on, this page fills in.</div>';return}
  var v={overview:viewOverview,clips:viewClips,schedule:viewSchedule,runs:viewRuns,tiktok:viewTikTok,golive:viewGoLive}[state.tab];
  main.innerHTML=v();
  if(state.tab==="overview")after_overview();
  $("#updated").textContent=D.generated_at?"Updated "+dt(D.generated_at)+" ("+ago(D.generated_at)+")":"";
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab]");if(t){state.tab=t.dataset.tab;try{history.replaceState(null,"","#"+state.tab)}catch(x){}render();return}
  var f=e.target.closest("[data-f]");if(f){state.filter=f.dataset.f;render();return}
  var c=e.target.closest("[data-copy]");if(c){copy(c.dataset.copy,c);return}
  var dn=e.target.closest("[data-done]");if(dn){var a=store("hg-tt-done")||[],i=a.indexOf(dn.dataset.done);if(i<0)a.push(dn.dataset.done);else a.splice(i,1);store("hg-tt-done",a);render();return}
  var r=e.target.closest("tr.row");if(r&&!e.target.closest("a")){state.open[r.dataset.id]=!state.open[r.dataset.id];render()}
});
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("tr.row")){e.preventDefault();e.target.click()}});
document.addEventListener("input",function(e){if(e.target.id==="q"){state.q=e.target.value;var p=e.target.selectionStart;render();var q=$("#q");if(q){q.focus();try{q.setSelectionRange(p,p)}catch(x){}}}});
document.addEventListener("change",function(e){if(e.target.id==="sort"){state.sort=e.target.value;render()}});
$("#theme").addEventListener("click",function(){var r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#121014";r.setAttribute("data-theme",dark?"light":"dark");render()});
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(D&&state.tab==="overview")render()},150)});

var h0=(location.hash||"").replace("#","");if(TABS.some(function(t){return t[0]===h0}))state.tab=h0;
function load(u){return fetch(u+"?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return null})}
Promise.all([load("data.json"),load("golive.json")]).then(function(r){D=r[0];G=r[1];render()});
render();
})();
</script>
</body>
</html>
