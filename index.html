<!doctype html>
<html lang="en">
<head>
<!--PAGES-ONLY--><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><!--/PAGES-ONLY-->
<title>HeadGeek Dashboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky bar, tab strip, one panel at a time. Data tables scroll inside their own box. */
:root{
  --bg:#f3f1f7; --surface:#fcfcfb; --surface-2:#f1eff5; --ink:#17131f; --ink-2:#4f4a5b; --ink-3:#6a6576;
  --line:#ded9e7; --accent:#6d2bd9; --accent-ink:#ffffff; --accent-soft:#ece4fb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --bad:#d03b3b;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121014; --surface:#1a1a19; --surface-2:#242227; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#9b97a6;
    --line:#38343f; --accent:#a678f5; --accent-ink:#15101f; --accent-soft:#2c2342;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121014; --surface:#1a1a19; --surface-2:#242227; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#9b97a6;
  --line:#38343f; --accent:#a678f5; --accent-ink:#15101f; --accent-soft:#2c2342;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:5rem}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin-inline:auto;padding-block:0 56px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.25rem}
h3{font-size:1rem}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.bar-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.5rem;line-height:1.1}
.brand small{color:var(--ink-3);font:12px var(--mono)}
.tools{display:flex;gap:8px;align-items:center}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font:12px var(--mono);background:var(--surface-2);border-radius:99px;padding:1px 7px;margin-left:6px;color:var(--ink-2)}
.tab .count.alert{background:var(--bad);color:#fff}

main{padding-top:22px;display:flex;flex-direction:column;gap:22px}
.banner{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.banner.sample{background:var(--accent-soft);border-color:var(--accent)}
.banner.bad{border-color:var(--bad)}
.banner.warn{border-color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stat .k{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font:600 2rem/1.15 var(--display);font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--ink-2)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}

.pill{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:2px 10px 2px 8px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.pill i{font-style:normal;font-weight:700}
.pill.posted i{color:var(--good)} .pill.failed i{color:var(--bad)} .pill.scheduled i{color:var(--accent)} .pill.waiting i{color:var(--ink-3)}
.pill.failed{border-color:var(--bad)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}

.tools-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:660px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface-2)}
.title{font-weight:600}
.sub{font-size:12px;color:var(--ink-3)}
.cellv{font:12px var(--mono);color:var(--ink-2);margin-top:4px}
.detail td{background:var(--surface-2)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.detail h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.box{white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 6px;font-family:var(--body)}
.err{color:var(--ink);border-left:3px solid var(--bad);padding-left:8px;font-size:13px;word-break:break-word}

.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
.item .l{min-width:0;flex:1 1 260px}
.item .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.events{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.events li{display:flex;gap:8px;align-items:baseline}
.done{opacity:.55}

.tipbox{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:3;min-width:150px}
.chartwrap{position:relative}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:8px}
svg text{font-family:var(--mono);font-size:11px;fill:var(--ink-3)}
.gridline{stroke:var(--line);stroke-width:1}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center}
.barrow .name{grid-column:1 / -1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:12px;background:var(--surface-2);border-radius:0 4px 4px 0}
.fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.barrow .val{font:12px var(--mono);text-align:right;color:var(--ink-2)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.empty b{display:block;font-family:var(--display);font-size:1.05rem;color:var(--ink);margin-bottom:4px}
footer{color:var(--ink-3);font-size:12px;margin-top:8px}
@media (prefers-reduced-motion: no-preference){.fill{transition:width .4s ease}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="bar-top">
      <div class="brand"><h1>HeadGeek Dashboard</h1><small id="updated">loading...</small></div>
      <div class="tools">
        <a class="btn primary" href="https://twitch.tv/headgeek81" target="_blank" rel="noopener">twitch.tv/headgeek81</a>
        <button class="btn" id="theme" type="button">Light / dark</button>
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <main id="main"></main>
  <footer>ClipBot checks Twitch, TikTok and your accounts once a day. "Mark done" buttons are saved in this browser only.</footer>
</div>
<noscript>This dashboard needs JavaScript.</noscript>

<script>
(function(){
"use strict";
var ET="America/New_York";
var TABS=[["overview","Overview"],["clips","Clips"],["schedule","Schedule"],["tiktok","TikTok"],["golive","Go live"]];
var D=null,G=null,state={tab:"overview",filter:"all",q:"",open:{}};
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(iso,o){try{return new Date(iso).toLocaleString("en-US",Object.assign({timeZone:ET},o))}catch(e){return ""}}
function dt(iso){return iso?fmt(iso,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+" ET":"-"}
function dday(iso){return iso?fmt(iso,{weekday:"short",month:"short",day:"numeric"}):"-"}
function ago(iso){var m=Math.round((Date.now()-new Date(iso))/60000);if(m<1)return"just now";if(m<60)return m+" min ago";var h=Math.round(m/60);if(h<48)return h+" hr ago";return Math.round(h/24)+" days ago"}
function pill(cls,sym,txt){return '<span class="pill '+cls+'"><i aria-hidden="true">'+sym+'</i>'+esc(txt)+'</span>'}
function copy(text,btn){
  function ok(){var o=btn.textContent;btn.textContent="Copied";setTimeout(function(){btn.textContent=o},1200)}
  function fb(){var t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){btn.textContent="Select and copy"}document.body.removeChild(t)}
  try{navigator.clipboard.writeText(text).then(ok,fb)}catch(e){fb()}
}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function flagged(k,id){return (store(k)||[]).indexOf(id)>=0}
function toggle(k,id){var a=store(k)||[],i=a.indexOf(id);if(i<0)a.push(id);else a.splice(i,1);store(k,a)}

function clips(){return (D.clips||[]).slice()}
function isFuture(c){return c.slot&&new Date(c.slot)>Date.now()-12*3600*1000}
function srcName(s){return {twitch:"Twitch clip",old:"Older Twitch clip",mine:"my_clips",tiktok:"From TikTok"}[s]||s}
function attention(){
  var a=[];
  clips().forEach(function(c){
    if(c.yt_error)a.push("YouTube scheduling failed for \""+c.title+"\": "+c.yt_error);
    else if(!c.yt_id)a.push("\""+c.title+"\" is not scheduled on YouTube. Post it by hand.");
    if(isFuture(c)&&!c.video_url)a.push("The video for \""+c.title+"\" is not on this dashboard. Get it from the run's Artifacts.");
  });
  (D.tiktok_posted||[]).forEach(function(t){if(t.status==="needs_download")a.push("TikTok video \""+(t.title||t.id)+"\" needs to be downloaded by hand and posted elsewhere.")});
  var r=(D.runs||[]).filter(function(x){return !x.dry_run}).slice(-1)[0];
  if(r)(r.events||[]).forEach(function(e){if(e.kind==="failed")a.push(e.text)});
  return a;
}

/* ---------- Overview ---------- */
function viewOverview(){
  var cl=clips(),up=cl.filter(isFuture),att=attention();
  var kitsLeft=cl.filter(function(c){return c.source!=="tiktok"&&!flagged("hg-tt-done",c.id)&&(isFuture(c)||!c.slot)}).length;
  var metaLeft=up.filter(function(c){return !flagged("hg-meta-done",c.id)}).length;
  var h='<div class="banner"><span>Fresh start as of <b>'+esc(D.since||"today")+'</b>. Everything below is from ClipBot v3.</span></div>';
  h+='<div class="stats">'+
    '<div class="stat"><div class="k">Scheduled on YouTube</div><div class="v">'+up.filter(function(c){return c.yt_id}).length+'</div><div class="s">going out on the days shown</div></div>'+
    '<div class="stat"><div class="k">To schedule on Meta</div><div class="v">'+metaLeft+'</div><div class="s">Facebook and Instagram, by hand</div></div>'+
    '<div class="stat"><div class="k">TikTok kits to post</div><div class="v">'+kitsLeft+'</div><div class="s">video, caption and comment ready</div></div>'+
    '<div class="stat"><div class="k">Needs attention</div><div class="v">'+att.length+'</div><div class="s">'+(att.length?"see below":"all clear")+'</div></div></div>';
  if(att.length)h+='<section class="card"><header><h2>Needs attention</h2></header><div class="list">'+att.map(function(a){return'<div class="err">'+esc(a)+'</div>'}).join("")+'</div></section>';
  var runs=(D.runs||[]).slice(-5).reverse();
  h+='<section class="card"><header><h2>Runs</h2><span class="muted">last 5</span></header>';
  if(!runs.length)h+='<div class="empty"><b>No runs yet</b>Each ClipBot run shows here with anything that went wrong.</div>';
  else h+='<div class="list">'+runs.map(function(r){
    var ev=r.events||[],bad=ev.filter(function(e){return e.kind==="failed"||e.kind==="warning"||e.kind==="attention"});
    var made=ev.filter(function(e){return e.kind==="kit"}).length;
    var sum=r.dry_run?"Preview only, nothing made":(made?made+" video"+(made===1?"":"s")+" made":"Nothing new to make");
    return'<div class="item"><div class="l"><div class="title">'+esc(dt(r.at))+' <span class="sub">'+esc(ago(r.at))+'</span></div><div>'+esc(sum)+'</div>'+
      (ev.length?'<ul class="events">'+ev.map(function(e){var bad2=e.kind==="failed";return'<li>'+pill(bad2?"failed":e.kind==="warning"||e.kind==="attention"?"waiting":"posted",bad2?"!":e.kind==="warning"||e.kind==="attention"?"…":"✓",e.kind)+'<span>'+esc(e.text)+'</span></li>'}).join("")+'</ul>':"")+
      '</div><div class="r">'+(bad.length?pill("failed","!",bad.length+" issue"+(bad.length===1?"":"s")):pill("posted","✓","No errors"))+(r.url?'<a class="btn" href="'+esc(r.url)+'" target="_blank" rel="noopener">View log</a>':"")+'</div></div>'}).join("")+'</div>';
  h+='</section>';
  h+='<section class="card"><header><h2>Next up</h2></header>';
  h+=up.length?'<div class="list">'+up.slice(0,5).map(function(c){return'<div class="item"><div class="l"><div class="title">'+esc(c.title)+'</div><div class="sub">'+esc(c.game||"")+'</div></div><div class="r"><span class="mono">'+esc(dday(c.slot))+'</span></div></div>'}).join("")+'</div>':'<div class="empty"><b>Nothing scheduled</b>ClipBot adds clips on its next daily run.</div>';
  return h+'</section>';
}

/* ---------- Clips ---------- */
function viewClips(){
  var q=state.q.toLowerCase(),cl=clips().filter(function(c){
    if(q&&(c.title+" "+(c.game||"")).toLowerCase().indexOf(q)<0)return false;
    if(state.filter==="scheduled")return isFuture(c);
    if(state.filter==="out")return !isFuture(c);
    if(state.filter==="failed")return !!c.yt_error||!c.yt_id;
    return true}).sort(function(a,b){return new Date(b.slot||b.made||0)-new Date(a.slot||a.made||0)});
  var h='<div class="tools-row"><input type="search" id="q" placeholder="Search clips or games" value="'+esc(state.q)+'" aria-label="Search clips"><div class="chips" role="group" aria-label="Filter">'+
    [["all","All"],["scheduled","Scheduled"],["out","Went out"],["failed","Problems"]].map(function(f){return'<button type="button" class="chip" data-f="'+f[0]+'" aria-pressed="'+(state.filter===f[0])+'">'+f[1]+'</button>'}).join("")+'</div></div>';
  if(!cl.length)return h+'<div class="empty"><b>No clips yet</b>Clips show up here after ClipBot makes them.</div>';
  h+='<div class="tablebox"><table><thead><tr><th>Day</th><th>Clip</th><th>From</th><th>YouTube</th><th>Title on video</th></tr></thead><tbody>';
  cl.forEach(function(c){
    var cap={always:"Shown the whole video",popup:"Shown for 5 seconds",none:"None (stream title or has its own)"}[c.caption_mode]||"";
    h+='<tr class="row" data-id="'+esc(c.id)+'" tabindex="0" aria-expanded="'+!!state.open[c.id]+'"><td class="mono">'+esc(dday(c.slot||c.made))+'</td><td><div class="title">'+esc(c.title)+'</div><div class="sub">'+esc(c.game||"")+'</div></td><td>'+esc(srcName(c.source))+'</td><td>'+
      (c.yt_error?pill("failed","!","Failed"):c.yt_id?'<a href="'+esc(c.yt_url)+'" target="_blank" rel="noopener">'+(isFuture(c)?"Scheduled":"Posted")+'</a>':pill("waiting","…","Not scheduled"))+'</td><td>'+esc(cap)+'</td></tr>';
    if(state.open[c.id]){
      var k=c.captions||{};
      h+='<tr class="detail"><td colspan="5"><div class="detail-grid">'+[["YouTube title",k.yt_title],["YouTube description",k.yt_desc],["Facebook caption",k.fb],["Instagram caption",k.ig],["TikTok caption",k.tt]].filter(function(x){return x[1]}).map(function(x){
        return'<div><h4>'+x[0]+'</h4><pre class="box">'+esc(x[1])+'</pre><button type="button" class="btn" data-copy="'+esc(x[1])+'">Copy</button></div>'}).join("")+'</div>'+(c.yt_error?'<div class="err" style="margin-top:10px"><b>YouTube:</b> '+esc(c.yt_error)+'</div>':"")+'</td></tr>';
    }
  });
  return h+'</tbody></table></div><p class="sub">Click a clip to see its captions.</p>';
}

/* ---------- Schedule (Facebook and Instagram kit) ---------- */
function metaCard(c){
  var k=c.captions||{},done=flagged("hg-meta-done",c.id);
  return'<div class="card'+(done?" done":"")+'"><header><div><h3>'+esc(c.title)+'</h3><div class="sub">'+esc(c.game||"")+' / '+esc(srcName(c.source))+'</div></div><div><span class="mono"><b>'+esc(dday(c.slot))+', 12:00 PM ET</b></span></div></header>'+
    '<div class="detail-grid"><div><h4>YouTube</h4>'+(c.yt_error?pill("failed","!","Failed"):c.yt_id?pill("scheduled","◷","Scheduled")+' <a href="'+esc(c.yt_url)+'" target="_blank" rel="noopener">open</a>':pill("waiting","…","Not scheduled"))+'</div>'+
    '<div><h4>Business Suite checklist</h4><div class="sub" style="line-height:1.7">☐ Post to Facebook and Instagram: both checked<br>☐ Share to story: on<br>☐ Schedule for '+esc(dday(c.slot))+' at 12:00 PM</div></div></div>'+
    '<div class="detail-grid" style="margin-top:12px">'+[["Facebook caption",k.fb],["Instagram caption",k.ig],["First comment (Facebook and Instagram)",k.fb_comment]].filter(function(x){return x[1]}).map(function(x){
      return'<div><h4>'+x[0]+'</h4><pre class="box">'+esc(x[1])+'</pre><button type="button" class="btn" data-copy="'+esc(x[1])+'">Copy</button></div>'}).join("")+'</div>'+
    '<div class="tools-row" style="margin:14px 0 0">'+(c.video_url?'<a class="btn primary" href="'+esc(c.video_url)+'" target="_blank" rel="noopener">Download video</a>':'<span class="pill waiting"><i>…</i>Video expired</span>')+
    '<button type="button" class="btn" data-meta="'+esc(c.id)+'">'+(done?"Undo":"Mark scheduled on Meta")+'</button></div></div>';
}
function viewSchedule(){
  var up=clips().filter(isFuture).sort(function(a,b){return new Date(a.slot)-new Date(b.slot)});
  var h='<div class="banner"><span><b>Facebook and Instagram are scheduled by hand</b> (Meta does not let ClipBot do it). Download the video, paste the caption, check both boxes and Share to story, and pick the date shown.</span></div>';
  if(!up.length)return h+'<div class="empty"><b>Nothing scheduled</b>ClipBot fills the next free days on its daily run.</div>';
  return h+up.map(metaCard).join("");
}

/* ---------- TikTok ---------- */
function viewTikTok(){
  var cl=clips().filter(function(c){return c.source!=="tiktok"}).sort(function(a,b){return new Date(b.slot||b.made||0)-new Date(a.slot||a.made||0)});
  var left=cl.filter(function(c){return !flagged("hg-tt-done",c.id)}).length;
  var h='<div class="banner"><span><b>'+left+' video'+(left===1?"":"s")+' waiting for TikTok.</b> Download, upload in TikTok Studio, paste the caption, then add the comment after it goes live.</span></div>';
  if(!cl.length)h+='<div class="empty"><b>No TikTok kits yet</b>Each video ClipBot makes gets a kit here.</div>';
  else h+='<div class="list">'+cl.map(function(c){
    var k=c.captions||{},done=flagged("hg-tt-done",c.id);
    return'<div class="item'+(done?" done":"")+'"><div class="l"><div class="title">'+esc(c.title)+'</div><div class="sub">'+esc(c.game||"")+' / '+esc(dday(c.slot||c.made))+'</div>'+
      '<div class="detail-grid" style="margin-top:8px">'+[["TikTok caption",k.tt],["Pinned comment",k.tt_comment],["Tags",k.tags]].filter(function(x){return x[1]}).map(function(x){return'<div><h4>'+x[0]+'</h4><pre class="box">'+esc(x[1])+'</pre><button type="button" class="btn" data-copy="'+esc(x[1])+'">Copy</button></div>'}).join("")+'</div></div>'+
      '<div class="r" style="align-self:flex-start">'+(c.video_url?'<a class="btn primary" href="'+esc(c.video_url)+'" target="_blank" rel="noopener">Download video</a>':'<span class="pill waiting"><i>…</i>Video expired</span>')+
      '<button type="button" class="btn" data-tt="'+esc(c.id)+'">'+(done?"Undo":"Mark posted")+'</button></div></div>'}).join("")+'</div>';
  var tp=D.tiktok_posted||[];
  h+='<section class="card" style="margin-top:22px"><header><h2>Posted on TikTok directly</h2><span class="muted">checked daily</span></header>';
  if(!tp.length)h+='<div class="empty"><b>Nothing seen yet</b>New videos on your TikTok page show up here. ClipBot queues them for YouTube and Meta.</div>';
  else h+='<div class="list">'+tp.map(function(t){
    var st={queued:["scheduled","◷","Queued for YouTube and Meta"],from_kit:["posted","✓","From a ClipBot kit"],needs_download:["failed","!","Download it by hand, then post elsewhere"],new:["waiting","…","New"]}[t.status]||["waiting","…",t.status];
    var inItems=clips().some(function(c){return c.id==="tt_"+t.id});
    if(t.status==="queued"&&inItems)st=["posted","✓","Added to the schedule"];
    return'<div class="item"><div class="l"><div class="title">'+esc(t.title||t.id)+'</div><div class="sub">'+esc(dday(t.at))+'</div></div><div class="r">'+pill(st[0],st[1],st[2])+'<a class="btn" href="'+esc(t.url)+'" target="_blank" rel="noopener">Open on TikTok</a></div></div>'}).join("")+'</div>';
  return h+'</section>';
}

/* ---------- Go live ---------- */
function viewGoLive(){
  var ch=((G&&G.checks)||[]).slice().reverse();
  if(!ch.length)return'<div class="empty"><b>No checks recorded yet</b>GoLive checks Twitch every few minutes. Each stream it announces appears here.</div>';
  function p(v,n){return'<span class="pill '+(v==="posted"?"posted":v==="failed"?"failed":"waiting")+'"><i>'+(v==="posted"?"✓":v==="failed"?"!":"…")+'</i>'+n+' '+esc(v||"")+'</span>'}
  return'<div class="list">'+ch.map(function(c){return'<div class="item"><div class="l"><div class="title">'+esc(dt(c.at))+'</div><div class="sub">'+(c.live?'Live: '+esc(c.title||"")+(c.game?' ('+esc(c.game)+')':""):'Offline, nothing posted')+'</div></div>'+
    (c.live?'<div class="r">'+p(c.facebook,"Facebook")+p(c.instagram,"Instagram")+'</div>':"")+'</div>'}).join("")+'</div>';
}

/* ---------- shell ---------- */
function tabsHtml(){
  var att=D?attention().length:0;
  $("#tabs").innerHTML=TABS.map(function(t){
    var extra=(D&&t[0]==="overview"&&att)?'<span class="count alert">'+att+'</span>':"";
    if(D&&t[0]==="schedule")extra='<span class="count">'+clips().filter(isFuture).length+'</span>';
    return'<button class="tab" role="tab" type="button" data-tab="'+t[0]+'" aria-selected="'+(state.tab===t[0])+'">'+t[1]+extra+'</button>'}).join("");
}
function render(){
  tabsHtml();
  var main=$("#main");
  if(state.tab==="golive"){main.innerHTML=viewGoLive();return}
  if(!D){main.innerHTML='<div class="empty"><b>No data yet</b>ClipBot has not published data.json. It appears after the next ClipBot run.</div>';return}
  main.innerHTML={overview:viewOverview,clips:viewClips,schedule:viewSchedule,tiktok:viewTikTok}[state.tab]();
  $("#updated").textContent=D.generated_at?"Updated "+dt(D.generated_at)+" ("+ago(D.generated_at)+")":"";
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab]");if(t){state.tab=t.dataset.tab;try{history.replaceState(null,"","#"+state.tab)}catch(x){}render();return}
  var f=e.target.closest("[data-f]");if(f){state.filter=f.dataset.f;render();return}
  var c=e.target.closest("[data-copy]");if(c){copy(c.dataset.copy,c);return}
  var m=e.target.closest("[data-meta]");if(m){toggle("hg-meta-done",m.dataset.meta);render();return}
  var tt=e.target.closest("[data-tt]");if(tt){toggle("hg-tt-done",tt.dataset.tt);render();return}
  var r=e.target.closest("tr.row");if(r&&!e.target.closest("a")){state.open[r.dataset.id]=!state.open[r.dataset.id];render()}
});
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("tr.row")){e.preventDefault();e.target.click()}});
document.addEventListener("input",function(e){if(e.target.id==="q"){state.q=e.target.value;var p=e.target.selectionStart;render();var q=$("#q");if(q){q.focus();try{q.setSelectionRange(p,p)}catch(x){}}}});
$("#theme").addEventListener("click",function(){var r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#121014";r.setAttribute("data-theme",dark?"light":"dark")});
var h0=(location.hash||"").replace("#","");if(TABS.some(function(t){return t[0]===h0}))state.tab=h0;
function load(u){return fetch(u+"?t="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){return null})}
Promise.all([load("data.json"),load("golive.json")]).then(function(r){D=r[0];G=r[1];render()});
render();
})();
</script>
</body>
</html>
